<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>R.S.T. — Loading</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="screen">
    <div id="bgA" class="bg bg--a"></div>
    <div id="bgB" class="bg bg--b"></div>
    <div class="overlay"></div>
    <div class="grain"></div>

    <main class="content">
        <header class="brand">
            <div class="logo-box"><img id="serverLogo" src="assets/logo/s.png" alt="R.S.T. logo"><span id="logoFallback">R.S.T</span></div>
            <div>
                <div class="brand-name">RIFT Project</div>
                <div class="brand-sub">Russian Sandbox Tartarus</div>
            </div>
        </header>

        <section class="main">
            <div class="eyebrow">ДОБРО ПОЖАЛОВАТЬ!</div>
            <h1 class="title">R.S.T<span>⠀</span></h1>
            <div id="status" class="status">Подключение к серверу...</div>

            <div class="progress-wrap">
                <div class="progress-head"><span>ЗАГРУЗКА</span><span id="percent" class="percent">0%</span></div>
                <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
                <div class="progress-foot"><span id="progressFoot">ОЖИДАНИЕ...</span><span id="serverMeta">R.S.T. // ONLINE</span></div>
            </div>

            <a id="discord" class="discord" href="https://discord.gg/ВАШ_КОД" target="_blank" rel="noopener"><span>DISCORD</span><span class="discord-arrow">→</span></a>
        </section>
    </main>

    <aside id="tip" class="tip">
        <div id="tipTitle" class="tip-title">СОВЕТ</div>
        <div id="tipText" class="tip-text">Следите за окружением — опасность может быть совсем рядом.</div>
    </aside>

    <audio id="backgroundMusic" loop preload="auto">
        <source src="assets/music/loading.mp3" type="audio/mpeg">
    </audio>
</div>
<script src="js/loading.js"></script>
</body>
</html>
